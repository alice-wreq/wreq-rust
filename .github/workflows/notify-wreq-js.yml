name: notify-wreq-js

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger wreq-js rebuild
        uses: peter-evans/repository-dispatch@v4
        with:
          # Cross-repo dispatch needs a PAT (repo scope) stored as WREQ_JS_DISPATCH_TOKEN.
          # Create: GitHub → Settings → Developer settings → PAT → org alice-wreq access.
          token: ${{ secrets.WREQ_JS_DISPATCH_TOKEN }}
          repository: alice-wreq/wreq-js
          event-type: wreq-rust-updated
          client-payload: |
            {
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}"
            }
